<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rahul Duvedi | Go. Linux. Open source.</title>
  <desc id="description">A dark navy terminal banner for Rahul Duvedi, with a cyan prompt, green branch motif, and the handle @rahulduvedi.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1728"/>
      <stop offset="1" stop-color="#080F1B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#20334C" stroke-width="1" stroke-opacity="0.32"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="898" height="258" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#background)"/>
    <rect x="512" width="388" height="260" fill="url(#grid)"/>
    <path d="M0 57H900" stroke="#203047"/>
    <circle cx="31" cy="29" r="5" fill="#FF6B72"/>
    <circle cx="49" cy="29" r="5" fill="#E9C46A"/>
    <circle cx="67" cy="29" r="5" fill="#67DDB4"/>
    <text x="103" y="34" fill="#8293A9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/opensource</text>
    <text x="864" y="34" text-anchor="end" fill="#91A4BB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">@rahulduvedi</text>
    <text x="43" y="142" fill="#6EE7F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="600">&gt;</text>
    <text x="88" y="144" fill="#F1F5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8">Rahul Duvedi</text>
    <text x="91" y="185" fill="#AFC2D8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">Go. Linux. <tspan fill="#67DDB4">Open source.</tspan></text>
    <g stroke="#67DDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M725 184V116M725 158C725 138 791 156 791 126V112" stroke-opacity="0.48"/>
      <circle cx="725" cy="106" r="10" fill="#0B1E25"/>
      <circle cx="791" cy="102" r="10" fill="#0B1E25"/>
      <circle cx="725" cy="194" r="10" fill="#0B1E25"/>
    </g>
    <path d="M856 89V212" stroke="#203047"/>
    <path d="M840 228H864" stroke="#6EE7F0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <rect x="1" y="1" width="898" height="258" rx="18" stroke="#23354D" stroke-width="2"/>
</svg>
